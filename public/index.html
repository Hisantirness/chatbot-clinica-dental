<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonrisa Sana - Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>🦷 Sonrisa Sana</h1>
      <p>¿En qué podemos ayudarte?</p>
    </header>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        <p>¡Hola! Bienvenido a Clínica Dental Sonrisa Sana. Soy tu asistente virtual, ¿en qué puedo ayudarte hoy?</p>
      </div>
    </div>

    <form class="chat-input" id="chat-form">
      <input type="text" id="message-input" placeholder="Escribe tu mensaje..." autocomplete="off" maxlength="500">
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>

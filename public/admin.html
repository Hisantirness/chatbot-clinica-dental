<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Sonrisa Sana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="header">
    <h1>Panel Administrativo - Sonrisa Sana</h1>
    <div class="header-actions" id="header-actions">
      <button class="btn btn-outline btn-sm hidden" id="exportBtn">Exportar CSV</button>
      <button class="btn btn-danger btn-sm hidden" id="logoutBtn">Cerrar sesion</button>
    </div>
  </div>

  <div class="container">
    <div class="login-box" id="loginBox">
      <h2>Acceder al panel</h2>
      <label for="tokenInput">Token de administrador</label>
      <input type="password" id="tokenInput" placeholder="Ingresa el token..." autocomplete="off">
      <button class="btn btn-primary btn-block" id="loginBtn">Ingresar</button>
    </div>

    <div id="dashboard" class="hidden">
      <div class="stats">
        <div class="stat-card"><div class="value" id="totalCitas">0</div><div class="label">Total citas</div></div>
        <div class="stat-card"><div class="value" id="proximasCitas">0</div><div class="label">Proximas</div></div>
        <div class="stat-card"><div class="value" id="hoyCitas">0</div><div class="label">Hoy</div></div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Cedula</th>
              <th>Telefono</th>
              <th>Servicio</th>
              <th>Dentista</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Accion</th>
            </tr>
          </thead>
          <tbody id="citasBody"></tbody>
        </table>
        <div class="empty hidden" id="emptyState">No hay citas registradas.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="admin.js"></script>
</body>
</html>

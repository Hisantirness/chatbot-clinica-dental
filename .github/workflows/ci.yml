name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Init database
        run: npm run init-db

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify environment setup
        run: |
          if [ ! -f .env.example ]; then
            echo "Missing .env.example"
            exit 1
          fi
          if [ ! -f README.md ]; then
            echo "Missing README.md"
            exit 1
          fi
          echo "GROQ_API_KEY=test" > .env
          node -e "
            const pkg = require('./package.json');
            const required = ['start', 'dev', 'init-db', 'test'];
            const missing = required.filter(s => !pkg.scripts[s]);
            if (missing.length > 0) {
              console.error('Missing scripts:', missing.join(', '));
              process.exit(1);
            }
            console.log('All required scripts present');
            console.log('Dependencies:', Object.keys(pkg.dependencies).join(', '));
          "
